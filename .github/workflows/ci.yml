# CI composition per #27: engine tests + app unit tests + lint + assemble on
# every change; benchmarks and screenshot *verification* are local/release-cycle
# gates for now (goldens are rendered on macOS; Linux font rendering differs).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
