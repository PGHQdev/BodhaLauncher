# CI composition per #27: engine tests + app unit tests + lint + assemble on
# every change; benchmarks and screenshot *verification* are local/release-cycle
# gates for now (goldens are rendered on macOS; Linux font rendering differs).
#
# APKs: pull requests keep the debug APK as a short-lived artifact; main pushes
# also build the signed, R8-minified release APK and replace the rolling
# `nightly` prerelease with both, so there is one stable sideload URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Screens consume roles, never raw values (#26) — 63 raw sizes accumulated
      # under that instruction because nothing checked. The rule is syntactic, so
      # it needs no lint module (ADR 0021).
      - name: No raw type sizes or faces outside the token layer
        run: |
          offenders=$(grep -rn --include='*.kt' -E 'fontSize *=|fontFamily *=' app/src/main \
            | grep -v '/BodhaTheme.kt:' || true)
          if [ -n "$offenders" ]; then
            echo "Raw type outside BodhaTheme.kt — use a BodhaType role:"
            echo "$offenders"
            exit 1
          fi

      - run: ./gradlew :engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: bodha-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # Secrets are unavailable to fork pull requests, so release signing runs
      # on main only.
      - name: Decode signing keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release
        if: github.event_name == 'push'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Replace the rolling nightly prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly ${GITHUB_SHA:0:7}" \
            --notes "Debug and signed release APKs built from ${GITHUB_SHA}. Replaced on every push to main." \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
