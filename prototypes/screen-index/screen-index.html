<title>Bodha — Screen Index (HTML rendition of bodhalauncher.png)</title>
<style>
  /* PROTOTYPE — wipe me. Issue #127.
     An HTML rendition of every screen in bodhalauncher.png, built so the visual
     language can be inspected and argued with rather than squinted at.
     Palette is the real one from BodhaTheme.kt. Dark is EXTRAPOLATED — the
     reference is light only. Clay and slate are APPROXIMATED — ADR 0019 settles
     three free accents, only sage is built. App icons are neutral placeholders:
     the brand marks are not the language, the row structure is. */
  :root {
    --ground:#F6F1E7; --ink:#2B261F; --muted:#7A7263; --accent:#7D8C6F;
    --hairline:rgba(43,38,31,.14); --card:#FBF8F1; --cardline:rgba(43,38,31,.10);
    --chip:#F0EADC; --tint:rgba(125,140,111,.18); --error:#9C4A38;
    --page:#EFE9DD;
  }
  :root[data-theme="dark"]{
    --ground:#221F1A; --ink:#EAE3D6; --muted:#9A9184; --accent:#93A284;
    --hairline:rgba(234,227,214,.16); --card:#2A2721; --cardline:rgba(234,227,214,.10);
    --chip:#332F27; --tint:rgba(147,162,132,.20); --error:#C4796A;
    --page:#1A1814;
  }
  :root[data-accent="clay"]{ --accent:#A8785E; --tint:rgba(168,120,94,.18) }
  :root[data-accent="slate"]{ --accent:#6C7C8C; --tint:rgba(108,124,140,.18) }
  :root[data-theme="dark"][data-accent="clay"]{ --accent:#BC8F76; --tint:rgba(188,143,118,.20) }
  :root[data-theme="dark"][data-accent="slate"]{ --accent:#869AAC; --tint:rgba(134,154,172,.20) }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--page);color:var(--ink);
    font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
    padding:2.6rem 1rem 6.5rem;
  }
  .serif{font-family:"Source Serif 4","Iowan Old Style",Palatino,Georgia,serif}
  header.page{text-align:center;margin-bottom:2.4rem}
  header.page h1{font-family:"Source Serif 4","Iowan Old Style",Palatino,Georgia,serif;
    font-size:3rem;font-weight:400;margin:0 0 .35rem;letter-spacing:-.01em}
  header.page .rule{display:flex;align-items:center;gap:1rem;justify-content:center;
    color:var(--muted);font-size:.95rem}
  header.page .rule::before,header.page .rule::after{content:"";height:1px;width:4rem;background:var(--hairline)}
  header.page p.sub{color:var(--muted);font-size:.82rem;margin:.9rem 0 0}

  .grid{display:flex;flex-wrap:wrap;gap:2.6rem 2rem;justify-content:center;max-width:88rem;margin:0 auto}
  figure{margin:0;width:19.5rem}
  figcaption{text-align:center;font-family:"Source Serif 4",Georgia,serif;
    font-size:1.05rem;margin-bottom:.7rem;color:var(--ink)}
  .phone{border-radius:2.1rem;padding:.5rem;background:#141310;
    box-shadow:0 16px 44px rgba(0,0,0,.16)}
  .screen{border-radius:1.7rem;height:38.5rem;background:var(--ground);color:var(--ink);
    overflow:hidden;display:flex;flex-direction:column;position:relative}
  .statusbar{display:flex;justify-content:space-between;align-items:center;
    padding:.7rem 1.1rem .2rem;font-size:.7rem;color:var(--ink);flex:0 0 auto}
  .statusbar .dot{width:.5rem;height:.5rem;border-radius:50%;background:#141310}
  .statusbar .right{display:flex;gap:.28rem;align-items:center;opacity:.85}
  .body{flex:1 1 auto;padding:.5rem 1rem 1rem;display:flex;flex-direction:column;overflow:hidden}

  svg.i{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  svg.i.sm{width:.9rem;height:.9rem}
  svg.i.lg{width:1.5rem;height:1.5rem}

  /* --- shared components of the language --- */
  .card{background:var(--card);border:1px solid var(--cardline);border-radius:.85rem}
  .rowcard{display:flex;align-items:center;gap:.7rem;padding:.6rem .65rem;min-height:3rem}
  .chip{width:2.1rem;height:2.1rem;border-radius:.6rem;background:var(--chip);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ink)}
  .listrow{display:flex;align-items:center;gap:.75rem;padding:.62rem .1rem;
    border-bottom:1px solid var(--hairline);min-height:3rem}
  .grow{flex:1 1 auto;min-width:0}
  .t{font-size:.92rem;line-height:1.25}
  .s{font-size:.76rem;color:var(--muted);line-height:1.3;margin-top:.08rem}
  .rowcard .s{white-space:nowrap}
  .rowcard>.grow{min-width:0}
  .rowcard>.trail{display:flex;align-items:center;gap:.35rem;flex:0 0 auto;white-space:nowrap}
  .rowcard>.trail .s{font-size:.7rem}
  .overline{font-size:.72rem;color:var(--muted);margin:.85rem 0 .38rem}
  .field{display:flex;align-items:center;gap:.6rem;border:1px solid var(--cardline);
    background:var(--card);border-radius:1.4rem;padding:.62rem .85rem;color:var(--muted);font-size:.88rem}
  .pill{display:flex;align-items:center;justify-content:center;gap:.5rem;
    border:1px solid var(--cardline);background:var(--card);border-radius:1.4rem;
    padding:.62rem .9rem;font-size:.88rem;position:relative}
  .pill .lead{position:absolute;left:.85rem;display:flex}
  .pill.solid{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:600}
  .pill.tinted{background:var(--tint);border-color:transparent}
  .stack{display:flex;flex-direction:column;gap:.42rem}
  .spacer{flex:1 1 auto}
  .center{text-align:center}
  .dots{display:flex;gap:.34rem;justify-content:center;margin:.7rem 0 .55rem}
  .dots i{width:.36rem;height:.36rem;border-radius:50%;background:var(--hairline);display:block}
  .dots i.on{background:var(--accent)}
  .appicon{width:2rem;height:2rem;border-radius:.55rem;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
  .round{border-radius:50%}
  .hair{height:1px;background:var(--hairline);margin:.7rem 0}
  .hero{height:11.5rem;margin:-.5rem -1rem .0;position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--chip),var(--ground))}
  .sheet{background:var(--card);border-radius:1.2rem 1.2rem 0 0;margin:0 -1rem -1rem;
    padding:.8rem 1rem 1rem;flex:1 1 auto;display:flex;flex-direction:column;
    border-top:1px solid var(--cardline)}
  .handle{width:2.2rem;height:.22rem;border-radius:1rem;background:var(--hairline);margin:0 auto .8rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .grid2 .pill{font-size:.79rem;padding:.6rem .4rem;text-align:center;white-space:nowrap}
  .rail{position:absolute;right:.35rem;top:5.2rem;bottom:1.2rem;display:flex;
    flex-direction:column;justify-content:space-between;font-size:.56rem;color:var(--muted)}
  .timeline{position:relative;padding-left:1.1rem}
  .timeline::before{content:"";position:absolute;left:.24rem;top:.55rem;bottom:.55rem;
    width:1px;background:var(--hairline)}
  .tl{display:flex;align-items:baseline;gap:.7rem;padding:.4rem 0;position:relative}
  .tl::before{content:"";position:absolute;left:-1.02rem;top:.72rem;width:.42rem;height:.42rem;
    border-radius:50%;background:var(--ink)}
  .avatars{display:flex;gap:.3rem;padding:.1rem 0 .1rem 2.85rem}
  .avatars span{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--chip);
    border:1px solid var(--cardline)}
  .radio{width:1.05rem;height:1.05rem;border-radius:50%;border:1.5px solid var(--hairline);flex:0 0 auto}
  .radio.on{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}
  .bar{height:.28rem;border-radius:1rem;background:var(--hairline);overflow:hidden;margin:.7rem 0 1rem}
  .bar i{display:block;height:100%;width:70%;background:var(--accent)}
  .mini{display:flex;flex-direction:column;align-items:center;gap:.3rem;
    padding:.55rem .3rem;font-size:.68rem;color:var(--muted)}

  .toolbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--page);
    border-top:1px solid var(--hairline);padding:.7rem 1rem;display:flex;gap:1.4rem;
    justify-content:center;flex-wrap:wrap;align-items:center}
  .toolbar .lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-right:.35rem}
  .toolbar .grp{display:flex;gap:.35rem;align-items:center}
  button{font:inherit;font-size:.8rem;padding:.34rem .7rem;cursor:pointer;background:transparent;
    color:var(--ink);border:1px solid var(--hairline);border-radius:.4rem}
  button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  .caveat{max-width:44rem;margin:2.6rem auto 0;color:var(--muted);font-size:.82rem;line-height:1.6}
  .caveat b{color:var(--ink)}
</style>

<main>
  <header class="page">
    <h1>Bodha</h1>
    <div class="rule">Intentional Launcher — Screen Index</div>
    <p class="sub">HTML rendition of <code>bodhalauncher.png</code> · prototype for issue #127</p>
  </header>
  <div class="grid" id="grid"></div>
  <div class="caveat" id="caveat"></div>
</main>

<div class="toolbar">
  <div class="grp"><span class="lbl">Theme</span><span id="tb"></span></div>
  <div class="grp"><span class="lbl">Accent</span><span id="ab"></span></div>
</div>

<script>
const ic = (n, cls="i") => `<svg class="${cls}"><use href="#${n}"/></svg>`;
const status = () => `<div class="statusbar"><span>9:41</span><span class="dot"></span>
  <span class="right">${ic("wifi","i sm")}${ic("sig","i sm")}${ic("batt","i sm")}</span></div>`;

const appIcon = (letter, colour, round) =>
  `<span class="appicon ${round?"round":""}" style="background:${colour}">${letter}</span>`;

const rowcard = (icon, title, sub, trail) => `
  <div class="card rowcard">
    ${icon ? `<span class="chip">${ic(icon)}</span>` : ""}
    <span class="grow"><span class="t">${title}</span>${sub?`<div class="s">${sub}</div>`:""}</span>
    ${trail || ""}
  </div>`;

const listrow = (lead, title, sub, trail) => `
  <div class="listrow">${lead}
    <span class="grow"><span class="t">${title}</span>${sub?`<div class="s">${sub}</div>`:""}</span>
    ${trail||""}</div>`;

const SCREENS = [
["1. Home", `
  <div class="body">
    <div style="display:flex;justify-content:flex-end;color:var(--accent);margin:.2rem .1rem -1.4rem">${ic("leaf")}</div>
    <div class="center" style="margin-top:.9rem">
      <div class="serif" style="font-size:3.3rem;line-height:1">9:41</div>
      <div class="serif" style="font-size:1rem;color:var(--muted);margin-top:.15rem">Tue, May 14</div>
    </div>
    <div class="card" style="padding:.7rem .8rem;margin-top:1.2rem">
      <div class="t">Today — Finish Bodha prototype</div>
      <div style="display:flex;align-items:center;gap:.45rem;margin-top:.4rem;color:var(--accent)">
        ${ic("cal","i sm")}<span class="s" style="color:var(--ink)">Work</span></div>
    </div>
    <div class="stack" style="margin-top:.55rem">
      ${rowcard("pencil","Continue writing")}
      ${rowcard("cal","Next meeting · 11:30")}
      ${rowcard("phone","Call Mom")}
      ${rowcard("cam","Camera")}
      ${rowcard("bell","Nothing urgent","You're all caught up.")}
    </div>
    <div class="dots"><i class="on"></i><i></i></div>
    <div class="field">${ic("search")}<span>Search apps, contacts, actions</span></div>
  </div>`],

["2. Intent", `
  <div class="body" style="padding-bottom:0">
    <div class="hero">
      <svg viewBox="0 0 200 130" style="width:100%;height:100%">
        <g fill="none" stroke="#8B9C7B" stroke-width="1.5" opacity=".75">
          <path d="M105 118C100 80 108 48 130 28"/>

          <ellipse cx="76" cy="70" rx="8" ry="3.5" transform="rotate(20 76 70)"/>
        </g>
        <g fill="#A9A396" opacity=".85">
          <ellipse cx="152" cy="112" rx="21" ry="7"/>
          <ellipse cx="152" cy="100" rx="15" ry="6"/>
          <ellipse cx="152" cy="90" rx="10" ry="4.5"/>
        </g>
      </svg>
    </div>
    <div class="sheet">
      <div class="handle"></div>
      <div class="serif center" style="font-size:1.55rem;line-height:1.25">What are you<br>here for?</div>
      <div class="grid2" style="margin-top:1rem">
        <div class="pill">Continue something</div><div class="pill">Communicate</div>

["3. Today", `

    ${rowcard("cal","11:30","Design review",`<span style="color:var(--muted)">${ic("chev")}</span>`)}

["4. Search", `

      ${ic("search")}<span class="grow">mom</span>${ic("x")}</div>
    ${listrow(appIcon("","#A9A396",true),"Call Mom","Mobile",`${ic("phone")}`)}

document.getElementById("caveat").innerHTML = `
  <b>What is faithful and what is not.</b> The palette is the real one from
  <code>BodhaTheme.kt</code>; serif and sans map to the shipped Source Serif 4 and
  Source Sans 3 with system fallbacks. <b>Dark is extrapolated</b> — the reference is
  light only — and clay and slate are approximated, since ADR 0019 settles three free
  accents but only sage exists in code. App icons are neutral placeholders on purpose:
  the brand marks are not the design language, the row structure is. The Intent and
  Reflection artwork is redrawn as flat SVG rather than reproduced.
  <br><br>
  <b>What the index makes arguable.</b> Two row idioms coexist and the reference is
  consistent about which goes where — <i>cards</i> for content blocks a user acts on
  once (Home actions, Today's slots, Settings, AI Assist) and <i>hairline rows</i> for
  lists that scroll (Search results, Library apps, Context modes). Fill already carries
  two meanings: tinted for the current or summarising thing (Today's intention, the
  selected context mode, "View all notifications"), solid sage for the one primary
  action on a screen (Open, Continue writing, send). Neither exists in the built app,
  and any later decision that reaches for fill is choosing for or against a vocabulary
  that is already spent here.`;

const mk = (host, items, attr, initial, onPick) => {
  host.innerHTML = items.map(i => `<button data-${attr}="${i}">${i}</button>`).join("");
  [...host.children].forEach(b => {
    b.setAttribute("aria-pressed", b.dataset[attr] === initial);
    b.onclick = () => { [...host.children].forEach(x => x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); onPick(b.dataset[attr]); };
  });
};
mk(document.getElementById("tb"), ["light","dark"], "t", "light",
   v => document.documentElement.dataset.theme = v);
mk(document.getElementById("ab"), ["sage","clay","slate"], "a", "sage",
   v => document.documentElement.dataset.accent = v);
document.documentElement.dataset.theme = "light";
document.documentElement.dataset.accent = "sage";
